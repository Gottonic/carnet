<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet Parkour</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Mon carnet d'entraînement parkour : calendrier, séances, suivi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
/* Layout: sticky header + pill tabs, single column (max 960px). Bright city-street look: white walls, painted-line blue, sunshine yellow for "now", pastel phase stickers. */
:root{
  --page:#F6F7F4; --surface:#FFFFFF; --surface-2:#EEF0EC; --line:#E1E4DE;
  --ink:#1B1E24; --ink-2:#4A505B; --ink-3:#7E8590;
  --accent:#4F6EF7; --accent-ink:#1D2B6B; --accent-soft:#EEF2FF; --accent-pastel:#D6E0FF;
  --mint-soft:#D4F2E2; --mint-ink:#14603A;
  --sun:#FFD43B; --sun-soft:#FFF5C7;
  --ph-hypertrophie:#8EC5FF; --ph-force:#FFA27F; --ph-puissance:#6FDDB0; --ph-specifique:#FFD43B; --ph-saison:#FFE27A; --ph-contraste:#C5A9FF; --ph-vitesse:#FF92C9; --ph-transition:#DADDD6; --ph-maintien:#DADDD6;
  --good:#12A150; --bad:#E5484D; --on-ph:#1B1E24;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1}
.brand .sub{color:var(--ink-3);font-size:13px}
.mode{font-family:var(--f-body);font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.mode{background:var(--surface);cursor:pointer;font-weight:600}
.mode.ok{color:var(--mint-ink);border-color:var(--mint-soft);background:var(--mint-soft)}
.mode.pend{color:var(--accent-ink);border-color:var(--accent-pastel);background:var(--accent-soft)}
.mode.off{border-style:dashed}
.mode.err{color:#8a1c1c;border-color:#f3c2c2;background:#fdeaea}
.login{position:fixed;inset:0;z-index:40;background:var(--page);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0}
.login p{margin:0;color:var(--ink-2)}
.login .err{color:#8a1c1c}
.welcome{border:2px solid var(--sun);background:var(--sun-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.welcome p{margin:0;max-width:68ch}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:6px 10px}
nav.tabs button{background:none;border:0;padding:7px 14px;font-family:var(--f-body);font-weight:600;font-size:15px;color:var(--ink-2);cursor:pointer;border-radius:99px;white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent-pastel)}
nav.tabs .spacer{flex:1}
@media (max-width:480px){nav.tabs button{padding:9px 8px 8px;font-size:14.5px;}.brand .sub{display:none}}
main{padding-block:20px 64px;display:flex;flex-direction:column;gap:28px}
h2{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent-pastel);border-color:var(--accent-pastel);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-3);}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--ink-2);background:var(--surface)}
.empty strong{color:var(--ink)}

/* season strip */
.season{display:flex;flex-direction:column;gap:10px}
.strip{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;height:46px;margin-top:10px}
@media (max-width:520px){.strip{gap:1px}.strip-labels .odd{display:none}}
.strip .seg{border:0;padding:0;border-radius:2px;background:var(--ph,var(--surface-2));cursor:pointer;opacity:.9;position:relative}
.strip .seg.past{opacity:.45}
.strip .seg.ev::after{content:"";position:absolute;left:50%;top:-7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ink)}
.strip .seg.ev.comp::after{width:7px;height:7px;margin-left:-3.5px;top:-9px;border-radius:1px;transform:rotate(45deg)}
.strip .seg.now{outline:2px solid var(--ink);outline-offset:1px;opacity:1}
.strip-labels{position:relative;height:18px;overflow:hidden;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.strip-labels span{position:absolute;white-space:nowrap;transform:translateX(0)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--ph);margin-right:6px;vertical-align:-1px}

/* calendar */
.month{display:flex;flex-direction:column;gap:8px}
.month h3{font-size:17px;color:var(--ink-2)}
.weeks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.weeks{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:104px;padding:8px 9px 8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;min-width:0}
.wk:hover{border-color:var(--ink-3)}
.wk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wk.past{opacity:.6}
.wk.now{border:2px solid var(--ink);padding:7px 8px 7px;background:var(--sun-soft)}
.wk.deload{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--surface-2) 7px 8px)}
.wk .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.wk .n{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1;letter-spacing:-.02em}
.wk .prog{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ink-2)}
.wk .d{font-size:12px;color:var(--ink-2)}
.wk .chips{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.bands{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.band{display:flex;justify-content:space-between;gap:4px;padding:2px 8px;border-radius:99px;background:var(--ph);color:var(--on,var(--on-ph));font-size:10.5px;line-height:1.45;white-space:nowrap;overflow:hidden}
.band b{font-weight:700;font-size:10.5px}
.band span{overflow:hidden;text-overflow:ellipsis}
.band.none{background:var(--surface-2);color:var(--ink-3)}
.chip.ctx{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.missed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.missed summary{cursor:pointer;font-weight:600}
.missed ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:5px;max-width:72ch}
.adapt{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:72ch;color:var(--ink)}
.chip.dlc{border:1px dashed var(--ink-2);background:var(--surface);font-weight:600;align-self:flex-start}
/* lanes timeline */
.lanes{display:flex;flex-direction:column;gap:3px}
.lane{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:center}
.lane-l{font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:right}
.cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.lane .c{height:22px;border-radius:5px;background:var(--ph);cursor:pointer}
.lane .c.past{opacity:.45}
.lane .c.now{outline:2px solid var(--ink);outline-offset:0}
.marks .cells{height:16px}
.mk{all:unset;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;height:16px;border-radius:2px}
.mk.now{background:var(--ink)}
.mk:focus-visible{outline:2px solid var(--accent)}
.m{display:block;font-style:normal}
.m.ev{width:5px;height:5px;border-radius:50%;background:var(--ink-2);margin-bottom:3px}
.m.comp{width:7px;height:7px;background:var(--ink);transform:rotate(45deg);margin-bottom:3px}
.mk.now .m.comp,.mk.now .m.ev{background:var(--surface)}
.m.dl{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-2);line-height:1}
.mk.now .m.dl{color:var(--surface)}
@media (max-width:520px){.cells{gap:1px}.lane{grid-template-columns:44px minmax(0,1fr);gap:6px}.lane .c{height:13px}.m.dl{font-size:8px}}
.legend .dlk{font-family:var(--f-mono);font-size:11px;margin-right:6px;color:var(--ink-2)}
.legend .evk{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-2);margin-right:6px;vertical-align:1px}
.legend .cpk{display:inline-block;width:7px;height:7px;background:var(--ink);transform:rotate(45deg);margin-right:7px;vertical-align:1px}
.gcol{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:nowrap;align-items:center;gap:6px 12px;overflow:hidden;width:100%;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.gcol:hover{border-color:var(--ink-3)}
.gcol:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gcol .chev{flex:0 0 26px;margin-top:0}
.gcol.open .chev::after{transform:rotate(45deg);top:7px}
.gtitle{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.grange{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gsum{flex-basis:100%;padding-left:38px}
.bhead{display:flex;flex-direction:column;gap:6px}
.bgoal{margin:0;max-width:72ch;color:var(--ink-2);font-size:14px}
.tp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:2px 8px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.tp i{width:9px;height:9px;border-radius:2px;background:var(--ph)}
.here{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px;background:var(--sun-soft);border:2px solid var(--sun);border-radius:var(--r)}
.here-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.here-t b{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.here .row{flex:1;min-width:0}
.here-pos{position:relative;height:20px}
.here-pos span{position:absolute;transform:translateX(-50%);font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--on-ph);background:var(--sun);padding:0 7px;border-radius:99px;line-height:16px;white-space:nowrap}
.here-pos span::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-top-color:var(--sun);border-bottom:0}
.edrow{align-items:end;border-top:1px solid var(--line);padding-top:10px}
.dlbanner{padding:10px 14px;border:1px dashed var(--ink-2);border-radius:var(--r);background:repeating-linear-gradient(135deg,var(--surface) 0 9px,var(--surface-2) 9px 10px);max-width:72ch}
.planner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pday{display:flex;flex-direction:column;gap:3px;padding:6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0;min-height:58px}
.pday .muted{font-size:12px}
.ps{font-size:12px;line-height:1.25;padding:2px 7px;border-radius:99px;background:var(--surface-2);overflow-wrap:anywhere}
.ps.ok{background:color-mix(in oklab,var(--good) 22%,var(--surface))}
@media (max-width:520px){.planner{grid-template-columns:repeat(4,minmax(0,1fr))}}
.altbtn[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun);font-weight:600}
.snote{display:flex;flex-direction:column;gap:4px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.snote label{font-size:12px;font-weight:600;color:var(--ink-3)}
.snote input{background:var(--page)}
.session.skipped .s-toggle{opacity:.55}
.tag.pair{background:var(--accent-soft);color:var(--accent-ink)}
.tag.st{background:var(--sun-soft);color:var(--ink)}
.fx{font-size:15px;line-height:1}
.tag.opt{background:none;border:1px dashed var(--line)}
.bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bt{font-size:13px;font-weight:700;color:var(--ink-2)}
.ssl{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:99px;background:var(--accent-pastel);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:13px}
.brule{font-size:13px;color:var(--ink-2);margin:3px 0 2px;max-width:70ch}
.ss .ssbody{margin-left:11px;padding-left:16px;border-left:2px solid var(--accent-pastel)}
.code{flex:0 0 auto;font-family:var(--f-display);font-weight:800;font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:2px 7px;margin-top:1px}
.bnote{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:12.5px}
.nmcell{display:flex;gap:10px;align-items:flex-start;min-width:0}
.thumb{all:unset;cursor:zoom-in;flex:0 0 56px;width:56px;height:70px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:focus-visible{outline:2px solid var(--accent)}
.item.zoomed .nmcell{flex-direction:column}
.thumb.big{cursor:zoom-out;flex-basis:auto;width:min(320px,100%);height:auto}
.thumb.big img{height:auto}
.act.none{display:block}
.cigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 18px}
.ci{display:flex;flex-direction:column;gap:4px;min-width:0}
.ci-l{font-size:12px;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{border:1px solid var(--line);background:var(--page);border-radius:99px;padding:4px 9px;font-size:13px;cursor:pointer;min-width:34px}
.seg button.on{background:var(--accent-pastel);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.idxsum{gap:8px 18px}
.isum{font-size:14px;color:var(--ink-2)}
.isum b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--ink);margin-right:4px}
.rseg label{position:relative;cursor:pointer}
.rseg input{position:absolute;opacity:0;width:1px;height:1px}
.rseg span{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-weight:600}
.rseg input:checked + span{background:var(--accent-pastel);border-color:var(--accent);color:var(--accent-ink)}
.rseg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.profile{margin:4px 0 0;font-size:13.5px;max-width:72ch;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.3;padding:2px 8px;border-radius:99px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--ink-2);color:var(--ink)}
.chip.competition{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.chip.vacances{border-style:solid;background:var(--surface)}
.chip.test{border-style:dashed}
.chip.autre{border-color:var(--line);color:var(--ink-2)}
.chip b{font-weight:700;font-size:10px}
.evlist{display:flex;flex-direction:column}
.evrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.evrow:first-child{border-top:0}
@media (max-width:520px){.evrow{grid-template-columns:1fr auto}.evrow .date{grid-column:1/-1}}

/* week */
.weekhead{display:flex;flex-direction:column;gap:10px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .btn{min-width:44px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--ph,var(--surface-2));color:var(--on-ph);font-size:13px;font-weight:600;}
.pill.none{color:var(--ink-2)}
.tip{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:18px;background:var(--accent-soft);border-radius:var(--r)}
.tip .q{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:.8;color:var(--accent);grid-row:span 2}
.tip h3{font-size:18px}
.tip p{margin:0;max-width:62ch;color:var(--ink)}

<script src="lib/supabase.js"></script>
<script>
"use strict";
const COLS = ["config","blocks","phases","events","weeks","logs","tests","content"];
const S = { data:{}, view:"calendrier", week:null, ui:{}, confirm:null };
COLS.forEach(c => S.data[c] = {});
const SB_URL = "https://rzcpjsffpvuvbdtqymms.supabase.co", SB_KEY = "sb_publishable_mJNXDji0NMOmLFqo3GusGg_JBkFhJmC", TABLE = "carnet", BUCKET = "carnet";
let sb = null, UID = null, EMAIL = "", prev = {}, dirty = new Set(), lastPull = null, pushing = false, pushTimer = null, syncErr = "", lastOk = null;
const app = document.getElementById("app");

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MO = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOL = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const pd = s => new Date(s + "T00:00:00Z");
const ds = d => d.toISOString().slice(0,10);
const addDays = (d,n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate()+n); return x; };
const todayUTC = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const mondayOf = d => addDays(d, -((d.getUTCDay()+6)%7));
function isoWeekId(date){
  const d = new Date(date); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+6)%7) + 3);
  const y = d.getUTCFullYear(); const jan4 = new Date(Date.UTC(y,0,4));
  const w = 1 + Math.round(((d - jan4)/86400000 - 3 + ((jan4.getUTCDay()+6)%7)) / 7);
  return y + "-W" + String(w).padStart(2,"0");
}
const fmtD = d => d.getUTCDate() + " " + MO[d.getUTCMonth()];
function fmtRange(a,b){
  return a.getUTCMonth() === b.getUTCMonth() ? a.getUTCDate() + "–" + b.getUTCDate() + " " + MO[b.getUTCMonth()] : fmtD(a) + " – " + fmtD(b);
}
const fmtLong = s => { if(!s) return ""; const d = pd(s); return d.getUTCDate() + " " + MO[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const numOrNull = v => { if(v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmtNum = (n, d=1) => n == null ? "–" : (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("fr-CH");
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }

const PHASES = {
  hypertrophie:{label:"Hypertrophie",short:"Hyp."}, force:{label:"Force max",short:"Force"}, puissance:{label:"Puissance",short:"Puiss."},
  specifique:{label:"Spécifique",short:"Spéc."}, contraste:{label:"French contrast",short:"Contr."}, vitesse:{label:"Vitesse",short:"Vit."}, saison:{label:"Saison",short:"Saison"}, maintien:{label:"Maintien",short:"Maint."}, transition:{label:"Transition",short:"Trans."}
};
const TRACKS = [["bas","Bas du corps","Bas"],["haut","Haut du corps","Haut"]];
const trackLabel = k => (TRACKS.find(t => t[0] === k) || [k,k,k])[1];
const EVT = { competition:"Compétition", vacances:"Vacances", test:"Tests", autre:"Autre" };
const KINDS = { force:"Force", hypertrophie:"Hypertrophie", puissance:"Puissance", parkour:"Parkour", endurance:"Endurance", mobilite:"Mobilité", test:"Tests", skills:"Skills", speed:"Speed", plyo:"Plyo", intervalles:"Intervalles", deload:"Décharge" };
const DAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

/* ---------- season model ---------- */
const cfg = () => S.data.config.main || {};
function seasonWeeks(){
  const start = mondayOf(pd(cfg().start || "2026-08-31"));
  const n = cfg().weeks || 52;
  return Array.from({length:n}, (_,i) => { const mon = addDays(start, 7*i); return { i, id: isoWeekId(mon), mon, sun: addDays(mon,6) }; });
}
function weekById(id){
  const w = seasonWeeks().find(x => x.id === id);
  if (w) return w;
  const m = /^(\d{4})-W(\d{2})$/.exec(id || ""); if(!m) return null;
  const jan4 = new Date(Date.UTC(+m[1],0,4)); const mon = addDays(mondayOf(jan4), 7*(+m[2]-1));
  return { i:-1, id, mon, sun:addDays(mon,6) };
}
const wkLabel = id => "S" + String(id).slice(6);
const phasesSorted = () => Object.entries(S.data.phases).map(([id,p]) => ({id,...p, track: p.track || "bas"})).filter(p => p.start && p.end).sort((a,b) => a.start < b.start ? -1 : 1);
function phaseOf(w, track){ const thu = addDays(w.mon,3); return phasesSorted().find(p => p.track === track && pd(p.start) <= thu && thu <= pd(p.end)) || null; }
const phVar = p => p ? "var(--ph-" + (PHASES[p.type] ? p.type : "transition") + ")" : "var(--surface-2)";
const fmtMin = m => m >= 60 ? Math.floor(m/60) + " h" + (m % 60 ? " " + String(m % 60).padStart(2,"0") : "") : m + " min";
const phName = p => p ? (p.name || PHASES[p.type]?.label || "") : "";
const blocksSorted = () => Object.entries(S.data.blocks || {}).map(([id,b]) => ({id,...b})).filter(b => b.start && b.end).sort((a,b) => a.start < b.start ? -1 : 1);
function blockOf(w){ const thu = addDays(w.mon,3); return blocksSorted().find(b => pd(b.start) <= thu && thu <= pd(b.end)) || null; }
function blockWeeks(b){ const out = []; for (let m = mondayOf(pd(b.start)); m <= pd(b.end); m = addDays(m,7)) out.push(isoWeekId(m)); return out; }
const isDeload = w => { const b = blockOf(w); return !!(b && b.deload === w.id); };
const eventsSorted = () => Object.entries(S.data.events).map(([id,e]) => ({id,...e})).filter(e => e.start).sort((a,b) => a.start < b.start ? -1 : 1);
function eventsOf(w){ return eventsSorted().filter(e => { const a = pd(e.start), b = pd(e.end || e.start); return a <= w.sun && b >= w.mon; }); }
function currentWeekId(){ return isoWeekId(todayUTC()); }
function planOf(id){
  const own = S.data.weeks[id]; const w = weekById(id); const b = w ? blockOf(w) : null;
  const ctx = (S.data.logs[id] && S.data.logs[id].context) || {};
  const keep = ss => (ss || []).filter(x => (!x.onlyIf || ctx[x.onlyIf]) && !(x.hideIf && ctx[x.hideIf]));
  if (own && own.sessions && own.sessions.length) return { ...own, sessions: keep(own.sessions), fromTemplate:false, block:b };
  const tpl = b && b.template && b.template.sessions ? b.template.sessions : null;
  return { ...(own || {}), sessions: keep(tpl), fromTemplate: !!tpl, block:b };
}
const tracked = id => id >= (cfg().trackingFrom || "0000");
const sessWeight = s => s.weight ?? (s.kind === "endurance" || s.id === "s-pk2" ? 0.7 : 1);
const DAY_STATUS = [["x","annulée"],["m","manquée"]];
const dayVal = v => /^\d$/.test(v) ? +v : v;
const dayOpts = cur => DAYS.map((d,i) => `<option value="${i}" ${String(cur)===String(i)?"selected":""}>${d}</option>`).join("") + DAY_STATUS.map(([k,l]) => `<option value="${k}" ${cur===k?"selected":""}>${l}</option>`).join("");
function weekProgress(id){
  const ss = planOf(id).sessions.filter(s => !s.optional); const log = S.data.logs[id] || {};
  const isDone = s => !!(log.sessions && log.sessions[s.id] && log.sessions[s.id].done);
  const done = ss.filter(isDone);
  return { planned: ss.length, done: done.length, wPlanned: ss.reduce((a,s) => a + sessWeight(s), 0), wDone: done.reduce((a,s) => a + sessWeight(s), 0) };
}

/* ---------- store : local d'abord, puis Supabase ---------- */
function canon(v){ if (Array.isArray(v)) return "[" + v.map(x => canon(x === undefined ? null : x)).join(",") + "]"; if (v && typeof v === "object") return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}"; return JSON.stringify(v === undefined ? null : v); }
const keyOf = (col, id) => col + "/" + id;
function fromPrev(){
  const d = {}; COLS.forEach(c => d[c] = {});
  for (const k in prev) { const i = k.indexOf("/"); const c = k.slice(0, i), id = k.slice(i + 1); if (!d[c]) continue; try { d[c][id] = JSON.parse(prev[k]); } catch(e) {} }
  S.data = d;
}
const CK = () => "carnet-cache-" + UID;
function persist(){ if (!UID) return; try { localStorage.setItem(CK(), JSON.stringify({ prev, dirty:[...dirty], lastPull, email:EMAIL })); } catch(e) {} }
function put(col, id, body){
  S.data[col] = { ...S.data[col], [id]: body };
  const k = keyOf(col, id), v = canon(body);
  if (prev[k] !== v) { prev[k] = v; dirty.add(k); persist(); schedulePush(); setSync(); }
  scheduleRender();
}
function del(col, id){
  const next = { ...S.data[col] }; delete next[id]; S.data[col] = next;
  const k = keyOf(col, id);
  if (k in prev) { delete prev[k]; dirty.add(k); persist(); schedulePush(); setSync(); }
  scheduleRender();
}
function schedulePush(d){ clearTimeout(pushTimer); pushTimer = setTimeout(push, d == null ? 1200 : d); }
async function push(){
  if (!sb || !UID || pushing || !dirty.size) { setSync(); return; }
  if (!navigator.onLine) { setSync(); return; }
  pushing = true; setSync("sending");
  const keys = [...dirty].slice(0, 200), sent = {};
  const rows = keys.map(k => { sent[k] = prev[k]; return (k in prev) ? { user_id:UID, key:k, data:JSON.parse(prev[k]), deleted:false } : { user_id:UID, key:k, data:null, deleted:true }; });
  try {
    const { error } = await sb.from(TABLE).upsert(rows, { onConflict:"user_id,key" }); if (error) throw error;
    keys.forEach(k => { if (prev[k] === sent[k]) dirty.delete(k); });
    persist(); lastOk = Date.now(); syncErr = ""; pushing = false; setSync();

}
async function pull(full){
  if (!sb || !UID) return false;
  if (!navigator.onLine) { setSync(); return false; }
  try {
    const since = full ? null : lastPull; let changed = false, maxTs = lastPull, from = 0;
    for (;;) {
      let q = sb.from(TABLE).select("key,data,deleted,updated_at").order("updated_at", { ascending:true }).range(from, from + 999);
      if (since) q = q.gte("updated_at", since);
      const { data, error } = await q; if (error) throw error;
      data.forEach(r => { if (!maxTs || r.updated_at > maxTs) maxTs = r.updated_at; if (dirty.has(r.key)) return;
        if (r.deleted || r.data == null) { if (r.key in prev) { delete prev[r.key]; changed = true; } }
        else { const v = canon(r.data); if (prev[r.key] !== v) { prev[r.key] = v; changed = true; } } });
      if (data.length < 1000) break; from += 1000;
    }
    lastPull = maxTs; persist();
    if (changed) { fromPrev(); scheduleRender(); }
    lastOk = Date.now(); syncErr = ""; setSync(); return true;

}
function syncState(){
  if (!navigator.onLine) return { cls:"off", txt:"hors ligne" + (dirty.size ? " · " + dirty.size : ""), tip:"Hors ligne : les changements partiront au retour du réseau" };
  if (syncErr) return { cls:"err", txt:"⚠ synchro" + (dirty.size ? " · " + dirty.size : ""), tip:"Problème de synchro : " + syncErr };
  if (pushing || dirty.size) return { cls:"pend", txt:"↻ envoi" + (dirty.size ? " · " + dirty.size : ""), tip:"Envoi en cours" };
  return { cls:"ok", txt:"✓ enregistré", tip:"Tout est enregistré" };
}

const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
const MEDIA = {}, MEDIA_P = {};
const mediaPath = id => UID + "/media/" + id;
async function loadMedia(path){
  if (MEDIA[path]) return MEDIA[path];
  if (MEDIA_P[path]) return MEDIA_P[path];
  return MEDIA_P[path] = (async () => {
    let blob = null;
    try { const c = await caches.open("carnet-media"); const hit = await c.match("media-cache/" + path); if (hit) blob = await hit.blob(); } catch(e) {}
    if (!blob && sb && navigator.onLine) {
      try { const { data, error } = await sb.storage.from(BUCKET).download(path); if (!error && data) { blob = data; try { const c = await caches.open("carnet-media"); await c.put("media-cache/" + path, new Response(data)); } catch(e) {} } } catch(e) {}
    }
    delete MEDIA_P[path];
    if (!blob) return null;
    return MEDIA[path] = URL.createObjectURL(blob);
  })();
}
function hydrateMedia(){
  app.querySelectorAll("img[data-mpath]").forEach(img => {
    const p = img.dataset.mpath; if (!p || p.startsWith("undefined/")) return;
    if (MEDIA[p]) { img.src = MEDIA[p]; return; }
    loadMedia(p).then(u => { if (u) img.src = u; else img.dispatchEvent(new Event("error")); });
  });
}
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
async function importMediaZip(file){
  if (!navigator.onLine) { toast("Connexion nécessaire pour importer les images."); return; }

    if (!window.JSZip) await loadScript("lib/jszip.min.js");
    const zip = await JSZip.loadAsync(file); const files = Object.values(zip.files).filter(f => !f.dir && /\.(jpe?g|gif|png|webp|mp4)$/i.test(f.name));
    const types = { jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif", png:"image/png", webp:"image/webp", mp4:"video/mp4" };
    let ok = 0;
    for (const f of files) {
      const base = f.name.split("/").pop(); const ext = base.split(".").pop().toLowerCase(); const id = base.replace(/\.[^.]+$/, "");
      S.ui.mediaMsg = "Envoi " + (ok + 1) + " / " + files.length + "…"; render();
      const blob = new Blob([await f.async("uint8array")], { type: types[ext] || "application/octet-stream" });
      const { error } = await sb.storage.from(BUCKET).upload(mediaPath(id), blob, { upsert:true, contentType: types[ext] });

  } catch(e) { S.ui.mediaMsg = "Import impossible : " + ((e && e.message) || e); render(); }

const CHART_DATA = {};
function niceScale(min, max, ticks=4){

function drawCharts(){

    const W = Math.max(260, el.clientWidth), H = 190, L = 40, R = 14, T = 14, B = 26;

    const sc = niceScale(mn, mx); const iw = W-L-R, ih = H-T-B;
    const n = pts.length; const xAt = i => cd.kind === "bar" ? L + (i+0.5)*iw/n : L + (n === 1 ? iw/2 : i*iw/(n-1));

    const every = Math.ceil(n / Math.max(1, Math.floor(iw/46)));
    g += pts.map((p,i) => (i % every === 0 || i === n-1) && !(i !== n-1 && n-1-i < every) || i === n-1 ? `<text x="${xAt(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--f-mono)">${p.label}</text>` : "").join("");
    let marks = "";
    if (cd.kind === "bar") {
      const bw = Math.max(3, Math.min(22, iw/n - 3));
      marks = pts.map((p,i) => { const y = yAt(p.y), h = Math.max(0, T+ih-y); return `<path d="M${xAt(i)-bw/2},${T+ih} V${y+Math.min(3,h)} q0,-${Math.min(3,h)} ${Math.min(3,bw/2)},-${Math.min(3,h)} H${xAt(i)+bw/2-Math.min(3,bw/2)} q${Math.min(3,bw/2)},0 ${Math.min(3,bw/2)},${Math.min(3,h)} V${T+ih} Z" fill="var(--accent)"/>`; }).join("");
    } else {
      const d = pts.map((p,i) => (i ? "L" : "M") + xAt(i).toFixed(1) + "," + yAt(p.y).toFixed(1)).join(" ");
      const area = d + ` L${xAt(n-1).toFixed(1)},${T+ih} L${xAt(0).toFixed(1)},${T+ih} Z`;
      marks = `<path d="${area}" fill="var(--accent)" fill-opacity=".10"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
        pts.map((p,i) => `<circle cx="${xAt(i)}" cy="${yAt(p.y)}" r="${i===n-1?5:3}" fill="${i===n-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("") +
        `<text x="${Math.min(xAt(n-1), W-R-4)}" y="${yAt(pts[n-1].y)-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)" font-family="var(--f-mono)">${fmtNum(pts[n-1].y)} ${cd.unit}</text>`;

/* ---------- rest timers ---------- */
function durList(t){ const out = []; String(t || "").replace(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(s|min)\b/g, (m,a,b,u) => { const v = +(b || a); out.push(u === "min" ? v*60 : v); return m; }); return out; }
const restSec = t => durList(t)[0] || 0;
const fmtSec = n => n >= 60 ? (n % 60 ? Math.floor(n/60) + " min " + (n % 60) + " s" : (n/60) + " min") : n + " s";
function blockTimers(b, letter){
  const d = durList(b.rule); let between = b.restBetween, after = b.restAfter;
  if (between == null && after == null) { if (d.length >= 2) { between = d[0]; after = d[1]; } else if (d.length === 1) { between = 0; after = d[0]; } }
  const btn = (sec, label, l) => `<button class="tbtn" data-action="timer" data-s="${sec}" data-l="${esc(l)}">⏱ ${label} ${fmtSec(sec)}</button>`;
  if (!between && !after) return "";
  if (between && between === after) return `<div class="tbtns">${btn(between, "pause", "Pause " + letter)}</div>`;
  return `<div class="tbtns">${between ? btn(between, "entre les deux", "Entre " + letter + "1 et " + letter + "2") : ""}${after ? btn(after, "après la paire", "Après la paire " + letter) : ""}</div>`;
}
const TM = { end:0, left:0, total:0, paused:false, iv:null, ctx:null, lock:null, label:"" };
const tEl = id => document.getElementById(id);
function tDraw(){
  const left = TM.paused ? TM.left : Math.max(0, TM.end - Date.now()); const sec = Math.ceil(left/1000);
  tEl("t-time").textContent = Math.floor(sec/60) + ":" + String(sec % 60).padStart(2,"0");
  tEl("t-bar").style.width = (TM.total ? (1 - left / TM.total) * 100 : 0) + "%";
  if (!TM.paused && left <= 0) tDone();
}
function tStart(sec, label){
  clearInterval(TM.iv); TM.total = sec*1000; TM.end = Date.now() + TM.total; TM.paused = false; TM.label = label;
  const t = tEl("timer"); t.hidden = false; document.body.classList.add("timing"); t.classList.remove("done"); tEl("t-label").textContent = label; tEl("t-pause").textContent = "Pause";
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => TM.lock = l).catch(() => {}); } catch(e){}
  TM.iv = setInterval(tDraw, 250); tDraw();
}
function tStop(){ clearInterval(TM.iv); tEl("timer").hidden = true; document.body.classList.remove("timing"); try { TM.lock && TM.lock.release(); } catch(e){} TM.lock = null; }
function tDone(){
  clearInterval(TM.iv); const t = tEl("timer"); t.classList.add("done"); tEl("t-time").textContent = "C'est reparti !"; tEl("t-bar").style.width = "100%";
  setTimeout(() => { if (t.classList.contains("done")) tStop(); }, 5000);
}
document.getElementById("timer").addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  if (b.dataset.t === "stop") tStop();
  else if (b.dataset.t === "plus") { if (TM.paused) TM.left += 15000; else TM.end += 15000; TM.total += 15000; tEl("timer").classList.remove("done"); clearInterval(TM.iv); if (!TM.paused) TM.iv = setInterval(tDraw, 250); tDraw(); }
  else if (b.dataset.t === "pause") {
    if (TM.paused) { TM.end = Date.now() + TM.left; TM.paused = false; b.textContent = "Pause"; TM.iv = setInterval(tDraw, 250); }
    else { TM.left = Math.max(0, TM.end - Date.now()); TM.paused = true; b.textContent = "Reprendre"; clearInterval(TM.iv); }
    tDraw();
  }
});

function compress(file, max, q){
  return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(); }; img.src = u; });
}

  fromPrev(); render();
  const ok = await pull(!c);
  if (ok) { if (isEmpty()) { if (S.view !== "donnees") setView("donnees"); } else await checkProgramme(false); }
  push(); render();
}
async function startApp(){
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch(e) {} }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
  if (!window.supabase || !window.supabase.createClient) { app.innerHTML = '<p class="empty">Impossible de charger l\'app. Recharge la page.</p>'; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"carnet-auth" } });
  let session = null; try { session = (await sb.auth.getSession()).data.session; } catch(e) {}
  if (session && session.user) await enter(session.user); else showLogin();
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && UID) { UID = null; prev = {}; dirty = new Set(); lastPull = null; fromPrev(); render(); showLogin(); } });
  addEventListener("online", () => { setSync(); pull().then(() => push()); });
  addEventListener("offline", () => setSync());
  document.addEventListener("visibilitychange", () => { if (!UID) return; if (document.visibilityState === "visible") pull().then(() => { push(); checkProgramme(false); }); else push(); });
  setInterval(() => { if (UID && document.visibilityState === "visible") pull(); }, 60000);
}
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); const btn = document.getElementById("l-btn"); btn.disabled = true;
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email:document.getElementById("l-mail").value.trim(), password:document.getElementById("l-pass").value });
    if (error) throw error; await enter(data.user);
  } catch(err) { showLogin(/invalid/i.test((err && err.message) || "") ? "E-mail ou mot de passe incorrect." : "Connexion impossible : " + ((err && err.message) || err)); }
  btn.disabled = false;
});
render();
startApp();
</script>
