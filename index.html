<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icons/icon-192.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F7F4;color:#1B1E24;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(380px,100%);padding:24px;display:flex;flex-direction:column;gap:14px}
img{width:64px;height:64px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
p{margin:0;color:#4a4f58}
a.btn{display:block;text-align:center;padding:12px 16px;border-radius:99px;background:#D6E0FF;color:#1D2B6B;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Le carnet a déménagé</h1>
  <p>Il s'appelle maintenant <strong>Forge</strong> et s'ouvre depuis l'app <strong>ORGA</strong>, à côté d'Établi. Tes données n'ont pas bougé.</p>
  <p>Si tu as ouvert cette page depuis l'ancienne icône « Carnet », tu peux la supprimer.</p>
  <a class="btn" href="https://gottonic.github.io/orga/forge/">Ouvrir Forge</a>
</main>
<script>
/* L'ancienne app installée affiche ce message ; dans un simple onglet, on va directement à Forge. */
(function(){
  var app = false; try { app = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; } catch(e) {}
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch(e) {} }
  if (!app) location.replace('https://gottonic.github.io/orga/forge/');
})();
</script>
</body>
</html>
